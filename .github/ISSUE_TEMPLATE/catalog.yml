name: Catalog entry
description: Propose or correct a CIR document
title: "[catalog] "
labels: ["catalog"]
body:
  - type: input
    id: framework
    attributes:
      label: Framework name
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pinned version and commit
    validations:
      required: true
  - type: textarea
    id: anchors
    attributes:
      label: Evidence anchors
      description: Path + symbol for each field you want changed.
    validations:
      required: true
