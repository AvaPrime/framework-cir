[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "framework-cir"
version = "0.1.0"
description = "Canonical Intermediate Representation for AI agent frameworks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ava Prime" }]
keywords = ["cir", "agents", "mcp", "reverse-engineering", "architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/AvaPrime/framework-cir"
Issues = "https://github.com/AvaPrime/framework-cir/issues"
Source = "https://github.com/AvaPrime/framework-cir"

[tool.hatch.build.targets.wheel]
packages = ["src/framework_cir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
